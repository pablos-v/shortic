server:
  port: 18082
eureka:
  client:
    service-url:
      defaultZone: http://localhost:18761/eureka
#properties:
#  adultAgeCriteria: 16

spring:
  application:
    name: backend_counting
  datasource:
    url: jdbc:h2:file:./dev_data/counting_db
    username: sa
    password:
  #  datasource:
  #    url: jdbc:postgresql://localhost:15432/postgres
  #    username: user
  #    password: password
  #    driverClassName: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    default-schema: shortic
    change-log: classpath:db/changelog/changelog-master.xml
    contexts: development, production
    drop-first: false
logging:
  level:
    org.springframework: INFO
    org.pablos.backend: DEBUG
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 5
  file:
    name: ./logs/${spring.application.name}.log