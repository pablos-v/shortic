<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head('Сократить ссылку')}">
    <!-- Включение head -->
</div>
<body>
<div th:replace="~{fragments/nav :: nav(${dtoForStats}, ${isMainPage})}">
    <!--<nav th:replace="~{menu :: menu(dto=${dto})}" th:fragment="menu">-->
    <!-- Включение меню -->
</div>

<form class="col card p-3 mb-5" th:method="post" th:action="@{/}" th:object="${input}">
<div class="form-group">
    <label type="hidden" for="link">Сократитель</label>
    <input class="form-control"
           id="link"
           placeholder="Введите ссылку"
           required="true"
           maxlength="4096"
           th:field="${input.fullLink}"
           type="text"/>
    <input class="btn btn-primary" type="submit" value="СОКРАТИТЬ"/>
</div>
</form>

<div th:replace="~{fragments/footer :: footer}" th:fragment="footer">
    <!-- Включение footer -->
</div>
</body>
</html>
