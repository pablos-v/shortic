<nav class="menu" th:fragment="nav(isMainPage)">
    <a th:if="${!isMainPage}" th:href="@{'/'}" class="btn btn-primary">На главную</a>
    <div th:if="${isMainPage}" class="logo"> </div>
    <form class="menu-form" th:method="get" th:action="@{/stats}" >
        <input class="form-control"
               type="text"
               name="shortLink"
               placeholder="сокращённая ссылка"
               required="true"
               maxlength="30"
        />
        <input class="form-control"
               type="password"
               name="password"
               placeholder="пароль 5 цифр"
               required="true"
               maxlength="5"
               pattern="\d{5}"
        />
        <input class="btn btn-secondary" type="submit" value="СТАТИСТИКА"/>
    </form>
</nav>
