services:

  db-postgres:
    image: postgres
    ports:
      - '5432:5432'
    container_name: shortic-db-postgres
    restart: always
    environment:
#      - POSTGRES_USER=sh_user
#      - POSTGRES_PASSWORD=kFjr63x
#      - POSTGRES_DB=shortic_db
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE}
    volumes:
      - shortic-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "${POSTGRES_DATABASE}", "-U", "${POSTGRES_USERNAME}" ]
      interval: 1s
      timeout: 5s
      retries: 10

  fast-postgres:
    image: postgres
    ports:
      - '5433:5432'
    container_name: shortic-fast-postgres
    restart: always
    environment:
      - POSTGRES_USER=fast_user
      - POSTGRES_PASSWORD=Sujfrbe
      - POSTGRES_DB=fast_db
#      - POSTGRES_USER=${POSTGRES_USERNAME}
#      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
#      - POSTGRES_DB=${POSTGRES_DATABASE}
    volumes:
      - shortic-fast-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "fast_db", "-U", "fast_user" ]
      interval: 1s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-rc-alpine
    restart: always
    container_name: shortic-db-redis
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    volumes:
      - shortic-cache:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 1s
      timeout: 5s
      retries: 10

  config-server:
    image: shortic-config
    ports:
      - '18001:18001'
    build:
      context: .
      dockerfile: Dockerfile-config-service
    container_name: shortic-config-server
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18001/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  #eureka:
  discovery-service:
    image: shortic-eureka
    ports:
      - '18761:18761'
    build:
      context: .
      dockerfile: Dockerfile-discovery-service
    container_name: shortic-eureka-server
    restart: always
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - SERVER_PORT=18761
      - SPRING_CLOUD_CONFIG_URI=http://shortic-config-server:18001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend-giving-service:
    image: shortic-backend-giving
    ports:
      - '18081:18081'
    build:
      context: .
      dockerfile: Dockerfile-backend-giving-service
    container_name: backend-giving-service
    restart: always
    depends_on:
      discovery-service:
        condition: service_healthy
      fast-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
#    environment:
#      - SERVER_PORT=18081
#      - SPRING_DATA_MONGODB_HOST=shortic-mongo-db
#      - SPRING_DATA_REDIS_HOST=http://shortic-db-redis
#      - EUREKA_URL=http://discovery-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend-counting-service:
    image: shortic-backend-counting
    ports:
      - '18082:18082'
    build:
      context: .
      dockerfile: Dockerfile-backend-counting-service
    container_name: backend-counting-service
    restart: always
    depends_on:
      db-postgres:
        condition: service_healthy
      backend-giving-service:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SERVER_PORT=18082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://shortic-db-postgres/postgres
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:18761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://shortic-config-server:18001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: shortic-frontend
    ports:
      - '18080:18080'
    build:
      context: .
      dockerfile: Dockerfile-frontend-service
    container_name: shortic-frontend
    depends_on:
      backend-counting-service:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SERVER_PORT=18080
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:18761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://shortic-config-server:18001
#    healthcheck:
#      test: ["CMD", "sleep", "10"] # Задержка 10 секунд
#      interval: 1s
#      timeout: 1s
#      retries: 1

volumes:
  shortic-cache:
    driver: local
  shortic-mongo:
    driver: local
  shortic-db-data:
    driver: local
  shortic-fast-data:
    driver: local