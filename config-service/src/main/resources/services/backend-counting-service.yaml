server:
  port: ${COUNTING_SERVICE_PORT}
properties:
  checking_api_key: ${CHECKING_API_KEY}
  checking_service_url: ${CHECKING_SERVICE_URL}
  threads_number: ${NUMBER_OF_THREADS_FOR_SCHEDULED_CHECKING}
  checking_length: ${TIME_LIMIT_FOR_SCHEDULED_CHECKING_IN_MINUTES}

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DATABASE}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driverClassName: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    default-schema: shortic
    change-log: classpath:db/changelog/changelog-master.xml
    contexts: development, production
    drop-first: false