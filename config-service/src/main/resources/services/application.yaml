eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost}:${EUREKA_PORT}/eureka
  config:
    import: optional:file:.env[.properties]

logging:
  level:
    org.springframework: INFO
    org.pablos.backend: DEBUG
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 5
  file:
    name: ./logs/${spring.application.name}.log